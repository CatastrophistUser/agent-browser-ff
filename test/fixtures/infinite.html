<!doctype html><html><head><title>Infinite</title></head><body><h1>Infinite</h1><div id="list"></div><div style="height:50px"></div>
<script>
let n=0;const list=document.getElementById('list');
function more(){for(let i=0;i<10&&n<30;i++){const d=document.createElement('div');d.className='row';d.textContent='Row '+(++n);d.style.height='120px';list.appendChild(d)}}
more();
window.addEventListener('scroll',()=>{if(innerHeight+scrollY>=document.documentElement.scrollHeight-100)setTimeout(more,100)});
</script></body></html>

<!doctype html><html><head><title>Form Page</title></head><body>
<h1>Contact Form</h1>
<form id="f" onsubmit="event.preventDefault();document.getElementById('out').textContent='submitted:'+new FormData(this).get('name')">
  <label for="name">Name</label><input id="name" name="name" type="text" placeholder="Your name">
  <label for="email">Email</label><input id="email" name="email" type="email">
  <label for="pw">Password</label><input id="pw" name="pw" type="password">
  <label for="age">Age</label><input id="age" name="age" type="number">
  <label for="when">When</label><input id="when" name="when" type="date">
  <label for="color">Color</label><input id="color" name="color" type="color" value="#ff0000">
  <label for="msg">Message</label><textarea id="msg" name="msg"></textarea>
  <label for="country">Country</label>
  <select id="country" name="country"><option value="us">United States</option><option value="in">India</option><option value="fr">France</option></select>
  <label><input type="checkbox" name="news" id="news"> Subscribe</label>
  <label><input type="radio" name="plan" value="free" checked> Free</label>
  <label><input type="radio" name="plan" value="pro"> Pro</label>
  <button type="submit">Send</button>
</form>
<div id="out"></div>
<div id="keys"></div>
<script>document.getElementById('name').addEventListener('keydown',e=>{document.getElementById('keys').textContent+=e.key.length===1?e.key:''})</script>
</body></html>
